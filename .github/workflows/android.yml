name: Build MFS HMH APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
    pip install buildozer==1.6.0 cython==0.29.37

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses

      - name: Install Android SDK
        run: |
    yes | sdkmanager --licenses
    sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0 platform-tools"
    echo "ANDROID_BUILD_TOOLS_VERSION=35.0.0" >> $GITHUB_ENV
    - name: Set Build Tools Version
      run: |
        echo "BUILDOZER_BUILD_TOOLS_VERSION=35.0.0" >> $GITHUB_ENV

    - name: Force Build Tools 35
      run: |
        sed -i "s/android.build_tools_version.*/android.build_tools_version = 35.0.0/" buildozer.spec

    - name: Check AIDL
      run: |
        ls $ANDROID_HOME/build-tools
        ls $ANDROID_HOME/build-tools/35.0.0/aidl

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MFS-HMH-APK
          path: bin/*.apk
