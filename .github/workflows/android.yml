name: Build MFS HMH APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    # PyPI's files.pythonhosted.org intermittently returns 502 for the
    # runner's pip downloads (runs 50-54). Mirror CDN + generous pip
    # retry/timeout keep pip-mediated downloads resilient.
    env:
      PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
      PIP_RETRIES: 10
      PIP_TIMEOUT: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install build dependencies
        # Native toolchain for any recipe that compiles C/C++ from source
        # (e.g. p4a recipes pulling CMake/ninja builds).
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config unzip

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set Android environment
        run: |
          echo "ANDROIDSDK=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Cache pip + buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            .buildozer
          key: ${{ runner.os }}-p4a-${{ hashFiles('buildozer.spec') }}

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.6.0 cython==0.29.37

      - name: Network diagnostics
        # Probes every host the build depends on; if the build fails again
        # the failing host is visible right here instead of a 403-gated log.
        run: |
          python - <<'EOF'
          import urllib.request
          urls = [
              "https://mirrors.aliyun.com/pypi/simple/",
              "https://pypi.org/simple/",
              "https://files.pythonhosted.org/",
              "https://github.com",
              "https://dl.google.com/android/repository/repository2-1.xml",
          ]
          for u in urls:
              try:
                  code = urllib.request.urlopen(u, timeout=20).status
                  print(f"OK  {code}  {u}")
              except Exception as e:
                  print(f"FAIL {u}  {e}")
          EOF

      - name: Build APK
        run: |
          for i in 1 2 3 4 5; do
            if buildozer android debug; then
              exit 0
            fi
            echo "Build attempt $i failed. Retrying..."
            rm -rf .buildozer/android/platform/build-arm64-v8a/packages
            sleep 30
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MFS-HMH-APK
          path: bin/*.apk
