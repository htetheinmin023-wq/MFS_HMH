name: Build MFS HMH APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    # PyPI's files.pythonhosted.org intermittently returns 502 for the
    # runner's pip downloads (runs 50-54). Mirror CDN + generous pip
    # retry/timeout keep pip-mediated downloads resilient.
    env:
      PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
      PIP_RETRIES: 10
      PIP_TIMEOUT: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install build dependencies
        # Native toolchain for p4a recipes: cmake/ninja for C builds;
        # libltdl-dev provides /usr/share/aclocal/libltdl.m4 which defines
        # the LT_SYS_SYMBOL_USCORE macro - libffi's autogen.sh/autoreconf
        # fails without it (p4a recipe docstring, runs 56-57).
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config unzip libtool libltdl-dev

      - name: Install Android SDK packages
        # Runs 60/62: "Requested API target 35 is not available" - the
        # platforms;android-35 install had silently not landed, and the
        # platform dir is verified + retried below before moving on.
        # Run 63: buildozer probed the legacy $ANDROID_SDK_ROOT/tools/bin/
        # sdkmanager, which crashes on Java 17 (javax.xml.bind removed).
        # Run 64: removing tools/ made buildozer report "sdkmanager is not
        # installed" - buildozer 1.6.0 only probes that exact path.
        # Fix: replace the legacy sdkmanager with a wrapper that delegates
        # to the modern cmdline-tools sdkmanager (Java 17 compatible).
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/tools/bin"
          printf '#!/bin/sh\nexec /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "$@"\n' > "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"
          chmod +x "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"
          "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" --version >/dev/null
          sdkmanager "platform-tools"
          sdkmanager "build-tools;35.0.0"
          for i in 1 2 3; do
            sdkmanager "platforms;android-35"
            if [ -f "$ANDROID_SDK_ROOT/platforms/android-35/android.jar" ]; then
              echo "OK: platforms;android-35 installed (android.jar present)"
              break
            fi
            echo "WARN: platforms/android-35/android.jar not found after install (attempt $i) - retrying"
            sleep 10
          done
          [ -f "$ANDROID_SDK_ROOT/platforms/android-35/android.jar" ] || { echo "FAIL: platforms;android-35/android.jar still missing"; exit 1; }

      - name: Set Android environment
        run: |
          echo "ANDROIDSDK=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          # Modern sdkmanager for buildozer/p4a subprocesses (legacy
          # tools/bin/sdkmanager is removed in the SDK packages step).
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Cache pip + buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            .buildozer
          key: ${{ runner.os }}-p4a-${{ hashFiles('buildozer.spec') }}

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.6.0 cython==0.29.37

      - name: Network diagnostics
        # Probes every host the build depends on; if the build fails again
        # the failing host is visible right here instead of a 403-gated log.
        run: |
          python - <<'EOF'
          import urllib.request
          urls = [
              "https://mirrors.aliyun.com/pypi/simple/",
              "https://pypi.org/simple/",
              "https://files.pythonhosted.org/",
              "https://github.com",
              "https://dl.google.com/android/repository/repository2-1.xml",
              "https://download.savannah.gnu.org/releases/freetype/freetype-2.14.1.tar.gz",
              "https://sourceforge.net/projects/freetype/files/freetype2/2.14.1/freetype-2.14.1.tar.gz/download",
          ]
          for u in urls:
              try:
                  code = urllib.request.urlopen(u, timeout=20).status
                  print(f"OK  {code}  {u}")
              except Exception as e:
                  print(f"FAIL {u}  {e}")
          EOF

      - name: Pre-download freetype
        # p4a fetches freetype (Pillow's C dependency) from
        # download.savannah.gnu.org, which returns a persistent 502 to the
        # runner. Pre-place the identical tarball from the SourceForge mirror
        # into p4a's package cache BEFORE the build.
        # IMPORTANT: p4a only trusts a cached tarball when the accompanying
        # ".mark-<filename>" marker exists - without it p4a deletes the file
        # and downloads again anyway (that is why run 70 still hit the 502).
        run: |
          FT_DIR=.buildozer/android/platform/build-arm64-v8a/packages/freetype
          FT_FILE=freetype-2.14.1.tar.gz
          MARKER=".mark-$FT_FILE"
          mkdir -p "$FT_DIR"
          if [ ! -f "$FT_DIR/$FT_FILE" ]; then
            for url in \
              "https://sourceforge.net/projects/freetype/files/freetype2/2.14.1/freetype-2.14.1.tar.gz/download" \
              "https://download.savannah.gnu.org/releases/freetype/freetype-2.14.1.tar.gz"; do
              echo "Trying $url ..."
              if curl -fL --retry 5 --max-time 120 -o "$FT_DIR/$FT_FILE" "$url"; then
                echo "OK: $url"
                break
              else
                echo "FAILED: $url"
              fi
            done
          fi
          if [ -f "$FT_DIR/$FT_FILE" ]; then
            : > "$FT_DIR/$MARKER"
            echo "Freetype ready (tarball + marker present)"
          else
            echo "FAIL: could not download freetype"
            exit 1
          fi
          ls -la "$FT_DIR"

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MFS-HMH-APK
          path: bin/*.apk
