name: Build MFS HMH APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    # PyPI's files.pythonhosted.org intermittently returns 502 for the
    # runner's pip downloads (runs 50-54). Mirror CDN + generous pip
    # retry/timeout keep pip-mediated downloads resilient.
    env:
      PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
      PIP_RETRIES: 10
      PIP_TIMEOUT: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install build dependencies
        # Native toolchain for p4a recipes: cmake/ninja for C builds;
        # libltdl-dev provides /usr/share/aclocal/libltdl.m4 which defines
        # the LT_SYS_SYMBOL_USCORE macro - libffi's autogen.sh/autoreconf
        # fails without it (p4a recipe docstring, runs 56-57).
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config unzip libtool libltdl-dev

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set Android environment
        run: |
          echo "ANDROIDSDK=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Cache pip + buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            .buildozer
          key: ${{ runner.os }}-p4a-${{ hashFiles('buildozer.spec') }}

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.6.0 cython==0.29.37

      - name: Network diagnostics
        # Probes every host the build depends on; if the build fails again
        # the failing host is visible right here instead of a 403-gated log.
        run: |
          python - <<'EOF'
          import urllib.request
          urls = [
              "https://mirrors.aliyun.com/pypi/simple/",
              "https://pypi.org/simple/",
              "https://files.pythonhosted.org/",
              "https://github.com",
              "https://dl.google.com/android/repository/repository2-1.xml",
              "https://download.savannah.gnu.org/releases/freetype/freetype-2.14.1.tar.gz",
              "https://sourceforge.net/projects/freetype/files/freetype2/2.14.1/freetype-2.14.1.tar.gz/download",
          ]
          for u in urls:
              try:
                  code = urllib.request.urlopen(u, timeout=20).status
                  print(f"OK  {code}  {u}")
              except Exception as e:
                  print(f"FAIL {u}  {e}")
          EOF

      - name: Build APK
        # freetype (Pillow's C dependency) is fetched by python-for-android
        # from download.savannah.gnu.org, which returns a persistent 502 to
        # the runner (all 5 attempts of run 55 died there). Pre-place the
        # identical tarball from the official SourceForge mirror into p4a's
        # package cache each attempt so p4a skips its own download.
        run: |
          FT_DIR=.buildozer/android/platform/build-arm64-v8a/packages/freetype
          FT_FILE=freetype-2.14.1.tar.gz
          for i in 1 2 3 4 5; do
            mkdir -p "$FT_DIR"
            if [ ! -f "$FT_DIR/$FT_FILE" ]; then
              echo "Pre-fetching $FT_FILE from SourceForge mirror..."
              for url in \
                "https://sourceforge.net/projects/freetype/files/freetype2/2.14.1/freetype-2.14.1.tar.gz/download" \
                "https://download.savannah.gnu.org/releases/freetype/freetype-2.14.1.tar.gz"; do
                if curl -fL --retry 5 --connect-timeout 30 -o "$FT_DIR/$FT_FILE" "$url"; then
                  echo "OK: $url"
                  break
                fi
                echo "FAILED: $url"
              done
              ls -la "$FT_DIR"
            fi
            if buildozer android debug; then
              exit 0
            fi
            echo "Build attempt $i failed. Retrying..."
            rm -rf .buildozer/android/platform/build-arm64-v8a/packages
            sleep 30
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MFS-HMH-APK
          path: bin/*.apk
