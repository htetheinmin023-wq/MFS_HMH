      - name: Setup Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          ls $ANDROID_HOME/build-tools
          ls $ANDROID_HOME/build-tools/35.0.0
      - name: Build APK
        run: |
          buildozer android debug

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

       - name: Install dependencies
  run: |
    python -m pip install --upgrade pip
    pip install buildozer cython==0.29.37
    yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
    $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Android SDK tools
        run: |
          mkdir -p $HOME/.buildozer/android/platform/android-sdk
          cp -r $ANDROID_HOME/build-tools $HOME/.buildozer/android/platform/android-sdk/
          cp -r $ANDROID_HOME/platforms $HOME/.buildozer/android/platform/android-sdk/
          cp -r $ANDROID_HOME/platform-tools $HOME/.buildozer/android/platform/android-sdk/
          ls $HOME/.buildozer/android/platform/android-sdk/build-tools     
 - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MFS-HMH-APK
          path: bin/*.apk
